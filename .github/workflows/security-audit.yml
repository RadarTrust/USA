name: Security and site integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository (pinned GitHub-owned action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run free security guardrails
        run: python3 tools/security_audit.py
      - name: Validate JavaScript syntax
        run: |
          find assets -type f -name '*.js' ! -path 'assets/vendor/*' -print0 |
            xargs -0 -r -n 1 node --check
      - name: Validate local site links and credential catalogs
        run: python3 tools/site_audit.py
